name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'

env:
  PROJECT_ID: trip-planner-prd
  REGION: europe-central2
  REPO: europe-central2-docker.pkg.dev/trip-planner-prd/trip-planner
  BACKEND_SERVICE: trip-planner-backend
  FRONTEND_SERVICE: trip-planner-frontend

jobs:
  pipeline:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/**'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'

      # ========================================================
      # STEP 1: TESTS
      # ========================================================
      - name: Set up Python for Tests
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Run Tests
        if: steps.filter.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/

      # ========================================================
      # AUTHENTICATE TO GCP
      # ========================================================
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ========================================================
      # STEP 2: BUILD IMAGES
      # ========================================================
      - name: Build Backend Image
        if: steps.filter.outputs.backend == 'true'
        run: docker build -t ${{ env.REPO }}/backend:${{ github.sha }} -f backend/Dockerfile .

      - name: Build Frontend Image
        if: steps.filter.outputs.frontend == 'true'
        run: docker build -t ${{ env.REPO }}/frontend:${{ github.sha }} -f frontend/Dockerfile .

      # ========================================================
      # STEP 3: PUSH IMAGES TO REPO
      # ========================================================
      - name: Push Backend Image
        if: steps.filter.outputs.backend == 'true'
        run: docker push ${{ env.REPO }}/backend:${{ github.sha }}

      - name: Push Frontend Image
        if: steps.filter.outputs.frontend == 'true'
        run: docker push ${{ env.REPO }}/frontend:${{ github.sha }}

      # ========================================================
      # STEP 4: DEPLOY TO CLOUD RUN
      # ========================================================
      - name: Deploy Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image ${{ env.REPO }}/backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --quiet

      - name: Deploy Frontend
        if: steps.filter.outputs.frontend == 'true'
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image ${{ env.REPO }}/frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --quiet
